[project]
name = "loom"
version = "0.3.0"
description = "A markdown-based, hierarchy-agnostic project management system."
authors = [
    { email = "dimohammed328@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.1",
    "watchdog>=6.0.0",
]

[project.scripts]
loom = "loom.cli:app"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
